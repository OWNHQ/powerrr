services:
  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    environment:
      NODE_ENV: production
      NUXT_POWERRR_DATA_MODE: ${POWERRR_DATA_MODE:-live}
      NUXT_PUBLIC_POWERRR_DATA_MODE: ${POWERRR_DATA_MODE:-live}
      NUXT_ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:?Set ETHEREUM_RPC_URL}
      NUXT_MORPHO_GRAPHQL_URL: ${MORPHO_GRAPHQL_URL:-https://api.morpho.org/graphql}
      NUXT_SOURCE_CLIENT_TIMEOUT_MS: ${POWERRR_SOURCE_CLIENT_TIMEOUT_MS:-5000}
      NUXT_POWERRR_INTERNAL_API_TOKEN: ${POWERRR_INTERNAL_API_TOKEN:-}
      NUXT_POWERRR_INTERNAL_SIGNING_SECRET: ${POWERRR_INTERNAL_SIGNING_SECRET:-}
      NUXT_OWN_AVAILABLE_LIQUIDITY_USD: ${OWN_AVAILABLE_LIQUIDITY_USD:-0}
      NUXT_OWN_INDICATIVE_APR: ${OWN_INDICATIVE_APR:-0.095}
      NUXT_OWN_TERM_MONTHS: ${OWN_TERM_MONTHS:-24}
      NUXT_OWN_LEAD_WEBHOOK_URL: ${OWN_LEAD_WEBHOOK_URL:-}
      NUXT_OWN_LEAD_WEBHOOK_SECRET: ${OWN_LEAD_WEBHOOK_SECRET:-}
      NUXT_OWN_LEAD_WEBHOOK_TIMEOUT_MS: ${OWN_LEAD_WEBHOOK_TIMEOUT_MS:-5000}
      NUXT_OWN_LEAD_DEVELOPMENT_MOCK: "false"
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/healthz').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  underwriter:
    build:
      context: .
      dockerfile: apps/internal-underwriter/Dockerfile
    environment:
      NODE_ENV: production
      NUXT_UNDERWRITER_USERNAME: ${UNDERWRITER_USERNAME:?Set UNDERWRITER_USERNAME}
      NUXT_UNDERWRITER_PASSWORD: ${UNDERWRITER_PASSWORD:?Set UNDERWRITER_PASSWORD}
    ports:
      - "3001:3001"
    restart: unless-stopped

  engine:
    profiles: ["fixture-engine"]
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      POWERRR_INTERNAL_API_TOKEN: ${POWERRR_INTERNAL_API_TOKEN:-}
      POWERRR_INTERNAL_SIGNING_SECRET: ${POWERRR_INTERNAL_SIGNING_SECRET:-}
    ports:
      - "4000:4000"
    restart: unless-stopped
