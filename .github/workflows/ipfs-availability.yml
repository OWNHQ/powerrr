name: ipfs-availability

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download latest release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$(gh release list --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("ipfs-"))] | sort_by(.createdAt) | reverse | .[0].tagName')"
          test -n "$TAG"
          gh release download "$TAG" --pattern release-metadata.json
      - name: Check immutable gateway URL
        run: |
          CID="$(jq -r .cid release-metadata.json)"
          test -n "$CID"
          curl --fail --location --retry 8 --retry-all-errors \
            --max-time 90 "https://${CID}.ipfs.dweb.link/" \
            --output /dev/null
