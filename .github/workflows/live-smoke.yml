name: live-smoke

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: Preview URL to verify
        required: false
        default: https://powerrr-ten.vercel.app

permissions:
  contents: read

jobs:
  verify-live-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live quote invariants
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url || 'https://powerrr-ten.vercel.app' }}
        run: node tooling/live-smoke.mjs
