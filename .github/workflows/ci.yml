name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm licenses:check
      - run: pnpm audit --prod --audit-level high
      - run: pnpm verify:morpho-registry
      - run: pnpm build:static
      - run: pnpm verify:static
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify generated static site in a browser
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/website/.output/public > /tmp/powerrr-static.log 2>&1 &
          PLAYWRIGHT_SKIP_WEBSERVER=1 PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173 pnpm test:e2e
