name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm licenses:check
      - run: pnpm audit --prod --audit-level high
      - run: pnpm verify:morpho-registry
      - run: pnpm build:static
      - run: pnpm verify:static
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify generated static site in a browser
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/website/.output/public > /tmp/powerrr-static.log 2>&1 &
          PLAYWRIGHT_SKIP_WEBSERVER=1 PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173 pnpm test:e2e
