name: release-ipfs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUXT_APP_CDN_URL: "./"
      NUXT_PUBLIC_CLARITY_PROJECT_ID: ${{ vars.NUXT_PUBLIC_CLARITY_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm licenses:check
      - run: pnpm audit --prod --audit-level high
      - run: pnpm verify:morpho-registry
      - run: pnpm build:static
      - run: pnpm verify:static
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify generated static site in a browser
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/website/.output/public > /tmp/powerrr-static.log 2>&1 &
          PLAYWRIGHT_SKIP_WEBSERVER=1 PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173 pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: powerrr-static-${{ github.sha }}
          path: apps/website/.output/public
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NUXT_PUBLIC_CLARITY_PROJECT_ID: ${{ vars.NUXT_PUBLIC_CLARITY_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: powerrr-static-${{ github.sha }}
          path: apps/website/.output/public
      - name: Recheck downloaded artifact
        run: node tooling/verify-static-artifact.mjs
      - name: Resolve protected ENS deployment
        id: ens
        run: |
          protected_cid="$(curl --fail --silent --show-error --head https://powerrr.eth.limo/ \
            | sed -n 's#^[Xx]-[Ii]pfs-[Rr]oots: \([^[:space:]]*\).*$#\1#p' \
            | tr -d '\r' \
            | head -n 1)"
          if [[ ! "$protected_cid" =~ ^b[a-z2-7]{20,}$ ]]; then
            echo "Could not resolve the protected powerrr.eth.limo CID." >&2
            exit 1
          fi
          echo "protected_cid=$protected_cid" >> "$GITHUB_OUTPUT"
      - name: Free an IPFS release slot
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_PROTECTED_CIDS: ${{ steps.ens.outputs.protected_cid }}
        run: node tooling/pinata-release.mjs prune 1
      - name: Ensure ENS deployment remains pinned
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: >-
          node tooling/pinata-release.mjs pin-hash
          ${{ steps.ens.outputs.protected_cid }}
      - name: Pin verified site to IPFS
        id: pinata
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: node tooling/pinata-release.mjs upload-directory
      - name: Wait for immutable gateway propagation
        env:
          IPFS_URL: ${{ steps.pinata.outputs.ipfs_url }}
        run: |
          for attempt in {1..30}; do
            content_type="$(curl --max-time 30 --silent --show-error \
              --output /dev/null --write-out '%{content_type}' \
              "${IPFS_URL}favicon.svg" || true)"
            if [[ "$content_type" == image/svg+xml* ]]; then
              exit 0
            fi
            echo "Gateway not ready (attempt ${attempt}/30, content type: ${content_type:-none})."
            sleep 10
          done
          echo "The immutable gateway did not serve the pinned favicon in time." >&2
          exit 1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify immutable IPFS site
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: ${{ steps.pinata.outputs.ipfs_url }}
        run: >-
          pnpm exec playwright test
          --grep 'static wallet scan is explicit|page-end credit links|connected result has no detectable'
      - name: Retain three Powerrr releases on Pinata
        id: retention
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_PROTECTED_CIDS: ${{ steps.ens.outputs.protected_cid }}
        run: node tooling/pinata-release.mjs prune 3
      - name: Create release metadata
        env:
          CID: ${{ steps.pinata.outputs.cid }}
          IPFS_URL: ${{ steps.pinata.outputs.ipfs_url }}
          ROLLBACK_CIDS: ${{ steps.retention.outputs.rollback_cids }}
        run: |
          node -e 'const fs=require("fs"); const rollbackCids=JSON.parse(process.env.ROLLBACK_CIDS||"[]"); const data={cid:process.env.CID,ipfsUrl:process.env.IPFS_URL,commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString(),checksumManifest:"SHA256SUMS",rollbackCids,tests:{repositoryCheck:"passed",unitCoverage:"passed",productionDependencyAudit:"passed",staticGeneration:"passed",checksumAndNetworkValidation:"passed",localStaticPlaywright:"passed",cidGatewayPlaywright:"passed"}}; fs.writeFileSync("release-metadata.json",JSON.stringify(data,null,2)+"\n"); fs.writeFileSync("release-notes.md",`Immutable IPFS site: ${data.ipfsUrl}\n\nCID: \`${data.cid}\`\n\nCommit: \`${data.commit}\`\n\nAll release checks passed. See \`release-metadata.json\` and \`SHA256SUMS\` for the recorded results and file digests.\n\nRollback CIDs: ${rollbackCids.length?rollbackCids.map(cid=>`\`${cid}\``).join(", "):"none yet"}\n`)'
          cp apps/website/.output/public/SHA256SUMS SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CID: ${{ steps.pinata.outputs.cid }}
          IPFS_URL: ${{ steps.pinata.outputs.ipfs_url }}
        run: |
          TAG="ipfs-${GITHUB_SHA::12}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Powerrr IPFS ${GITHUB_SHA::12}" \
            --notes-file release-notes.md \
            SHA256SUMS release-metadata.json
      - name: Publish link in workflow summary
        env:
          CID: ${{ steps.pinata.outputs.cid }}
          IPFS_URL: ${{ steps.pinata.outputs.ipfs_url }}
          ROLLBACK_CIDS: ${{ steps.retention.outputs.rollback_cids }}
        run: |
          echo "## Powerrr IPFS release" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${IPFS_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CID: \`${CID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rollback CIDs: \`${ROLLBACK_CIDS}\`" >> "$GITHUB_STEP_SUMMARY"
