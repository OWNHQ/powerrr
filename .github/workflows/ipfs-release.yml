name: release-ipfs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm audit --prod --audit-level high
      - run: pnpm build:static
      - run: pnpm verify:static
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify generated static site in a browser
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/website/.output/public > /tmp/powerrr-static.log 2>&1 &
          PLAYWRIGHT_SKIP_WEBSERVER=1 PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173 pnpm test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: powerrr-static-${{ github.sha }}
          path: apps/website/.output/public
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: powerrr-static-${{ github.sha }}
          path: apps/website/.output/public
      - name: Recheck downloaded artifact
        run: node tooling/verify-static-artifact.mjs
      - name: Create deterministic CID and CAR
        id: ipfs
        uses: ipfs/ipfs-deploy-action@v2
        with:
          path-to-deploy: apps/website/.output/public
          github-token: ${{ github.token }}
          cid-profile: ""
          ipfs-add-options: "--cid-version 1"
          car-file-name: powerrr-${{ github.sha }}.car
      - name: Pin verified site to IPFS
        id: pinata
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: node tooling/pinata-release.mjs upload-car "${{ steps.ipfs.outputs.car-path }}"
      - name: Confirm Pinata pinned the verified DAG
        env:
          EXPECTED_CID: ${{ steps.ipfs.outputs.cid }}
          PINATA_CID: ${{ steps.pinata.outputs.cid }}
        run: test "$EXPECTED_CID" = "$PINATA_CID"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify immutable IPFS site
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: ${{ steps.pinata.outputs.ipfs_url }}
        run: pnpm test:e2e
      - name: Retain three Powerrr releases on Pinata
        id: retention
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: node tooling/pinata-release.mjs prune 3
      - name: Create release metadata
        env:
          CID: ${{ steps.pinata.outputs.cid }}
          IPFS_URL: ${{ steps.pinata.outputs.ipfs_url }}
          ROLLBACK_CIDS: ${{ steps.retention.outputs.rollback_cids }}
        run: |
          node -e 'const fs=require("fs"); const rollbackCids=JSON.parse(process.env.ROLLBACK_CIDS||"[]"); const data={cid:process.env.CID,ipfsUrl:process.env.IPFS_URL,commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString(),checksumManifest:"SHA256SUMS",rollbackCids,tests:{repositoryCheck:"passed",unitCoverage:"passed",productionDependencyAudit:"passed",staticGeneration:"passed",checksumAndNetworkValidation:"passed",localStaticPlaywright:"passed",cidGatewayPlaywright:"passed"}}; fs.writeFileSync("release-metadata.json",JSON.stringify(data,null,2)+"\n"); fs.writeFileSync("release-notes.md",`Immutable IPFS site: ${data.ipfsUrl}\n\nCID: \`${data.cid}\`\n\nCommit: \`${data.commit}\`\n\nAll release checks passed. See \`release-metadata.json\` and \`SHA256SUMS\` for the recorded results and file digests.\n\nRollback CIDs: ${rollbackCids.length?rollbackCids.map(cid=>`\`${cid}\``).join(", "):"none yet"}\n`)'
          cp apps/website/.output/public/SHA256SUMS SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CID: ${{ steps.pinata.outputs.cid }}
          IPFS_URL: ${{ steps.pinata.outputs.ipfs_url }}
          CAR_PATH: ${{ steps.ipfs.outputs.car-path }}
        run: |
          TAG="ipfs-${GITHUB_SHA::12}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Powerrr IPFS ${GITHUB_SHA::12}" \
            --notes-file release-notes.md \
            "$CAR_PATH" SHA256SUMS release-metadata.json
      - name: Publish link in workflow summary
        env:
          CID: ${{ steps.pinata.outputs.cid }}
          IPFS_URL: ${{ steps.pinata.outputs.ipfs_url }}
          ROLLBACK_CIDS: ${{ steps.retention.outputs.rollback_cids }}
        run: |
          echo "## Powerrr IPFS release" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${IPFS_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CID: \`${CID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rollback CIDs: \`${ROLLBACK_CIDS}\`" >> "$GITHUB_STEP_SUMMARY"
